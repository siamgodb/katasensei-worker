# KataGo analysis engine, tuned for one RunPod GPU worker.
#
# Derived from cpp/configs/analysis_example.cfg in katasensei. That file is the
# authority and gains keys between releases — diff this against the version you
# actually built before assuming it is complete.
#
# Nothing about a *query* belongs here. Visits, ownership, the human-SL profile
# and interim reporting are all set per request in app/query.py, because they
# differ by plan and by whether the caller is a review or the analysis board.
# What is left is how this box uses the card in front of it.

# ---------------------------------------------------------------- concurrency

# The analysis engine batches positions from all its threads into one GPU call,
# so more in flight means a fuller batch and a busier card. This is why a GPU
# review is not merely a faster CPU review: on CPU these numbers fight over
# cores, and here they feed a device that is idle unless you keep it fed.
numAnalysisThreads = 12
numSearchThreadsPerAnalysisThread = 8

# Big enough to hold what those threads produce. A batch that fills is the
# difference between using the card and taking turns on it.
nnMaxBatchSize = 64

# 2^21 positions. A review walks a single game forwards, so consecutive
# searches share nearly all of their tree — this cache is where that shows up.
nnCacheSizePowerOfTwo = 21
nnMutexPoolSizePowerOfTwo = 17

# ------------------------------------------------------------------- backend

# auto = use half precision where the card supports it and it tests as correct.
# On the cards RunPod rents this roughly doubles throughput; KataGo falls back
# on its own if the check fails, so it is not a gamble.
cudaUseFP16 = auto
cudaUseNHWC = auto

# One worker, one card. Set explicitly rather than left to discovery, because a
# host that reports two devices would otherwise have the engine load the net
# twice and halve the memory available to each.
numNNServerThreadsPerModel = 1

# ------------------------------------------------------------------- reporting

# Every winrate and score in a response is stated for whoever is to move.
# summarise() converts once, to Black, and everything downstream depends on
# that being the only conversion — changing this would silently flip the graph.
reportAnalysisWinratesAs = SIDETOMOVE

# The principal variation a candidate move carries. The board draws at most
# eight; longer costs nothing to compute and is worth having in the logs.
analysisPVLen = 15

# stderr is the log here: a serverless container is thrown away after each quiet
# period, so files on its disk are read by nobody, while stderr is collected by
# RunPod and is the only account of a startup that failed.
#
# logDir points somewhere real rather than being left empty. An empty value is
# not "no directory" — it is a directory named "", and KataGo is strict about
# its config.
logDir = /tmp/katago
logAllRequests = false
logSearchInfo = false
logToStderr = true
